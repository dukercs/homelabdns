apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoramento

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus

rules:
# Descoberta de recursos
- apiGroups: [""]
  resources:
    - nodes
    - nodes/proxy
    - services
    - endpoints
    - pods
  verbs: ["get", "list", "watch"]

# Métricas do kubelet/cAdvisor
- apiGroups: [""]
  resources:
    - nodes/metrics
  verbs: ["get"]

# Ingresses (útil para futuras descobertas)
- apiGroups: ["networking.k8s.io"]
  resources:
    - ingresses
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus

subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: monitoramento

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus