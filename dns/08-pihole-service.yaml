apiVersion: v1
kind: Service

metadata:
  name: pihole
  namespace: dns
  labels:
    app: pihole

spec:
  type: LoadBalancer
  externalTrafficPolicy: Local

  selector:
    app: pihole

  ports:
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: 53

    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 53

---
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
  namespace: dns

spec:
  type: ClusterIP

  selector:
    app: pihole

  ports:
  - name: http
    port: 80
    targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: pihole
  namespace: dns

spec:
  ingressClassName: traefik

  rules:
  - host: pihole.1901d

    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: pihole-web
            port:
              number: 80