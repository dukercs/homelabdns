apiVersion: v1
kind: Service

metadata:
  name: prometheus
  namespace: monitoramento
  labels:
    app: prometheus

spec:
  type: ClusterIP

  selector:
    app: prometheus

  ports:
  - name: http
    protocol: TCP
    port: 9090
    targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoramento

spec:
  ingressClassName: traefik

  rules:
    - host: prometheus.1901d
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090