apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoramento
  labels:
    app: grafana

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      containers:
      - name: grafana
        image: grafana/grafana:12.2.0
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 3000
          name: http
          protocol: TCP

        envFrom:
        - secretRef:
            name: grafana-secret

        resources:
          requests:
            cpu: 100m
            memory: 256Mi

          limits:
            cpu: 500m
            memory: 512Mi

        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana

        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30

        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10

      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-data