apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: node-exporter
  namespace: monitoramento
  labels:
    app: node-exporter

spec:
  selector:
    matchLabels:
      app: node-exporter

  template:
    metadata:
      labels:
        app: node-exporter

    spec:
      hostNetwork: true
      hostPID: true

      containers:
      - name: node-exporter
        image: prom/node-exporter:v1.9.1
        imagePullPolicy: IfNotPresent

        args:
        - --path.rootfs=/host

        ports:
        - containerPort: 9100
          name: metrics

        resources:
          requests:
            cpu: 20m
            memory: 32Mi

          limits:
            cpu: 100m
            memory: 128Mi

        volumeMounts:
        - name: root
          mountPath: /host
          readOnly: true
          mountPropagation: HostToContainer

      volumes:
      - name: root
        hostPath:
          path: /
          type: Directory